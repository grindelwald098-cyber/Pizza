services:
  postgres:
    image: postgres:18
    container_name: pizza-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: pizza_user
      POSTGRES_PASSWORD: pizza_password
      POSTGRES_DB: pizza_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  # S3-совместимое хранилище.
  # Официальные образы MinIO сейчас недоступны без лицензии,
  # поэтому локально используем LocalStack (тот же S3 API / minio SDK).
  minio:
    image: localstack/localstack:4
    container_name: pizza-minio
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - minio_data:/var/lib/localstack

  minio-init:
    image: localstack/localstack:4
    container_name: pizza-minio-init
    depends_on:
      - minio
    restart: on-failure
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:4566
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url=http://minio:4566 s3 ls; do
        echo 'waiting for s3...';
        sleep 2;
      done;
      aws --endpoint-url=http://minio:4566 s3 mb s3://pizza-media || true;
      printf '%s' '{
        \"Version\": \"2012-10-17\",
        \"Statement\": [{
          \"Sid\": \"PublicRead\",
          \"Effect\": \"Allow\",
          \"Principal\": \"*\",
          \"Action\": [\"s3:GetObject\"],
          \"Resource\": [\"arn:aws:s3:::pizza-media/*\"]
        }]
      }' > /tmp/bucket-policy.json;
      aws --endpoint-url=http://minio:4566 s3api put-bucket-policy --bucket pizza-media --policy file:///tmp/bucket-policy.json;
      echo 's3 bucket ready';
      "

volumes:
  postgres_data:
  minio_data:
